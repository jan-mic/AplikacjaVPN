name: Build Standalone EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Pobierz kod z repozytorium
        uses: actions/checkout@v4

      - name: Zainstaluj .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Zbuduj samodzielny plik .exe
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish

      - name: Opublikuj plik w GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Najnowsza wersja (Windows x64)
          body: Automatycznie zbudowany plik wykonywalny `.exe` (nie wymaga instalacji .NET).
          files: publish/*.exe
